  patterns:
    - '**/*.postman_collection.json'
  output_sub: 'postman'
  file_suffix: '.suggestion.txt'
  prompt_tpl: |
    Você é um especialista em QA de API usando Postman.

    As seções abaixo **devem** ser entregues indentadas com dois espaços antes de cada linha de conteúdo, mantendo o título alinhado à esquerda, e sem qualquer texto adicional:

    Com base nesta coleção JSON do Postman e mudanças recentes:

    %{context}

    Mudanças recentes:

    %{diff}

    1. **Melhoria na Coleção Postman**
      - Mostre a estrutura reorganizada ou snippets otimizados.
    2. **Dicas**
      - Uso de variáveis de ambiente e scripts de testes.
    3. **Assertivas Mais Específicas**
      - Exemplos de testes embutidos para respostas HTTP.
    4. **Considerações Adicionais**
      - Organização de pastas, pre-request scripts.
    5. **Resumo**
      - Síntese em até 2-3 linhas.
